# fly.io config for the SHARED NAM HARNESS RUNTIME (glyphh-ai-runtime).
#
# One always-on shared runtime for the NAM region (devops.md §8-A + the
# runtime/stator split): ROTOR_MODE=harness serves interactive chat/work/code
# turns; memory lives in the regional pgvector stator (ROTOR_STATOR_URL secret);
# auth is introspection against the prod control plane. PRIVATE by design —
# flycast (6PN) only, no public IPs: the control plane's turn proxy
# (/api/harness/*) and stator proxy (/api/stator/*) are the only doors in.
#
# Deploy:  fly deploy -a glyphh-ai-runtime -c deploy/fly.nam.toml
# Secrets: ROTOR_STATOR_URL, ROTOR_AUTH_INTROSPECT_URL, ROTOR_AUTH_SERVICE_TOKEN

app = "glyphh-ai-runtime"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"      # deploy/Dockerfile — the stateless runtime image

[env]
  PORT = "8080"
  ROTOR_MODE = "harness"
  ROTOR_STATOR_BACKEND = "pgvector"
  ROTOR_LOG_FORMAT = "json"
  # Every model call rides the prod gateway (metered + governed; config.ts law).
  GLYPHH_GATEWAY_URL = "https://glyphh-ai-server.fly.dev/api/gateway"

[http_service]
  internal_port = 8080
  # flycast is plain http on the private network — the proxy terminates nothing.
  force_https = false
  # A SHARED regional runtime is always-on: a cold start on someone's first
  # message reads as "the runtime is down".
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  # The harness spawns a Claude Agent SDK subprocess per run — give it headroom.
  size = "shared-cpu-2x"
  memory = "2048mb"
