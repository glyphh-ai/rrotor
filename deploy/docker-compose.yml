# docker-compose — local multi-service stack that demonstrates THE CROSS-POD L3
# STORY on one machine (docs/runtime.md §6.1 phase 5).
#
# The point: run TWO rotor instances against ONE shared stator (Postgres+pgvector)
# and ONE shared coordination channel (Redis). Because the pods are fungible
# (SPEC.md §17.1) — no run-critical state in either process — a run started via one
# rotor can be continued/replayed by the other from the shared event history. This
# is the same design as the k8s Deployment, shrunk to a laptop: the two `rotor`
# services here are the local stand-in for interchangeable pods.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   curl localhost:8080/readyz   # instance A
#   curl localhost:8081/readyz   # instance B — same shared stator behind both

services:
  # --- the shared stator backend: Postgres + pgvector (SPEC.md §17.1, §3.2) -----
  # This is where run state actually lives — the append-only event history, Context,
  # and HDC store. Both rotor instances read/write HERE, not their own memory.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openrotor
      POSTGRES_PASSWORD: openrotor
      POSTGRES_DB: openrotor
    ports:
      - "5432:5432"
    volumes:
      - stator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrotor -d openrotor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- the pool-coordination channel: Redis (SPEC.md §17.3) --------------------
  # The pending-rotors queue + warm-pool bookkeeping the (future) affinity ring and
  # the k8s HPA's `pending_rotors` metric read. Shared so pool decisions are global.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- rotor instance A --- one fungible pod ----------------------------------
  rotor-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      ROTOR_PORT: "8080"
      ROTOR_STATOR_BACKEND: "postgres"
      ROTOR_STATOR_URL: "postgres://postgres:5432/openrotor"
      ROTOR_STATOR_USER: "openrotor"
      ROTOR_STATOR_PASSWORD: "openrotor"
      ROTOR_CHANNEL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- rotor instance B --- a SECOND fungible pod, same shared stator ----------
  # Identical config to rotor-a except its published port. Any run is servable by
  # either — that is the cross-pod invariant, demonstrable locally.
  rotor-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      ROTOR_PORT: "8080"
      ROTOR_STATOR_BACKEND: "postgres"
      ROTOR_STATOR_URL: "postgres://postgres:5432/openrotor"
      ROTOR_STATOR_USER: "openrotor"
      ROTOR_STATOR_PASSWORD: "openrotor"
      ROTOR_CHANNEL: "redis://redis:6379/0"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  stator-data:
