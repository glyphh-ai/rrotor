# Deployment — the MULTI-NODE rotor runtime: a set of interchangeable rotor pods.
#
# THE FUNGIBILITY INVARIANT (SPEC.md §17.1): no run-critical state lives in a pod.
# Any pod MAY serve any run — including one another pod started — by loading the
# run's pinned definitionVersion and continuing from the recorded event history in
# the external stator. This is why `replicas: 3` is safe and why a rolling update or
# a node failure never loses a run: the state was never in the pod. The Deployment
# is therefore a pool of fungible instances (docs/runtime.md §5.3), scaled
# horizontally, spread across nodes, and disposable one pod at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rrotor
  labels:
    app.kubernetes.io/name: rrotor
    app.kubernetes.io/component: runtime
spec:
  # Baseline floor of 3 interchangeable pods — the HPA drives the actual count
  # (min 3 / max 20). Because pods are fungible, count is a pure capacity knob.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rrotor
      app.kubernetes.io/component: runtime
  # Rolling update: swap pods a few at a time, never dropping below the fleet. Safe
  # precisely BECAUSE pods are fungible — a run in flight resumes on any surviving or
  # replacement pod from the shared stator.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never dip below desired capacity during a roll
      maxSurge: 1           # add one new pod at a time, then retire an old one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rrotor
        app.kubernetes.io/component: runtime
    spec:
      # Spread pods across NODES so one node failure cannot take the whole pool.
      # Fungibility makes anti-affinity a pure availability win: it never matters
      # WHICH node runs a pod, only that they are spread.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rrotor
                    app.kubernetes.io/component: runtime
      # Give in-flight runs a beat to checkpoint to the stator on shutdown; the run
      # then resumes on another pod (SPEC.md §17.1 — wait/interrupt checkpoints).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: rrotor
          # Replace with your registry/tag. Built from deploy/Dockerfile.
          image: rrotor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # ROTOR_* config + creds from the shared ConfigMap/Secret — identical on
          # every pod, pointing at the external stator/model/channel.
          envFrom:
            - configMapRef:
                name: rrotor-config
            - secretRef:
                name: rrotor-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # Liveness → /healthz: is the process up + the event loop turning? A
          # failure restarts THIS pod only; the run is unaffected (state is external).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness → /readyz: can this pod serve runs (capability manifest)? A
          # not-ready pod is pulled from the Service's endpoints — never gets traffic
          # — but is NOT restarted. This is how a pod that lost its stator connection
          # stops receiving requests until it recovers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup gate so a slow cold-start (model load, stator connect) doesn't
          # trip the liveness probe before the pod is up.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
