# Service (ClusterIP) — the single stable front for the fungible pod pool.
#
# FUNGIBILITY in action: the Service load-balances across ALL ready pods with no
# session stickiness — any request goes to any pod (SPEC.md §17.1: "a load balancer
# MAY route any request to any pod"). Instance affinity (SPEC.md §17.4), when it
# lands, is a determinism-neutral routing PREFERENCE layered above this, never a
# correctness requirement — so plain round-robin here is always correct.
apiVersion: v1
kind: Service
metadata:
  name: openrotor
  labels:
    app.kubernetes.io/name: openrotor
    app.kubernetes.io/component: runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openrotor
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
