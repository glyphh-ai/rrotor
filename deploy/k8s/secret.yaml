# Secret (TEMPLATE) — credentials for the external stator + model backends.
#
# This is a COMMITTED TEMPLATE with placeholder values only. Do NOT put real
# credentials here. In a real cluster, supply these from a sealed-secret / external
# secret manager (e.g. External Secrets Operator, Vault, SOPS), never plain YAML.
#
# FUNGIBILITY: like the ConfigMap, every pod mounts the SAME Secret — the creds are
# for the shared external stator/model, not per-pod identity. A pod carries no
# authority of its own; every effect is checked against the run's recorded grant set
# (SPEC.md §17.5), so the Secret only opens the transport, it does not grant scope.
apiVersion: v1
kind: Secret
metadata:
  name: openrotor-secret
  labels:
    app.kubernetes.io/name: openrotor
    app.kubernetes.io/component: runtime
type: Opaque
stringData:
  # Stator (Postgres) credentials — the shared cross-pod event-history backend.
  ROTOR_STATOR_USER: "REPLACE_ME_stator_user"
  ROTOR_STATOR_PASSWORD: "REPLACE_ME_stator_password"

  # Model lane API key — for a proxied/BYOK inference endpoint (SPEC.md §3.3, §8.5).
  # Empty for a purely local llama-server lane.
  ROTOR_MODEL_API_KEY: "REPLACE_ME_model_api_key"

  # Pool-coordination (Redis) auth, if the channel requires it.
  ROTOR_CHANNEL_PASSWORD: "REPLACE_ME_redis_password"
