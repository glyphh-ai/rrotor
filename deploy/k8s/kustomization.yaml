# Kustomization — applies the full multi-node manifest set as one unit.
#
#   kubectl apply -k deploy/k8s
#
# The set describes a Deployment of FUNGIBLE rotor pods (SPEC.md §17.1) fronted by a
# ClusterIP Service, scaled by the HPA (3→20), protected by the PDB, and configured
# from the shared ConfigMap/Secret that point every pod at the EXTERNAL stator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
commonLabels:
  app.kubernetes.io/name: openrotor
  app.kubernetes.io/part-of: openrotor
