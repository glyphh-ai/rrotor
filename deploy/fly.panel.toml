# fly.io config for a PANEL POD pool (architecture-engines-memory.md §7b).
#
# The panel tier is SEPARATE and HEAVIER than the session/loop pods: it bakes headless
# Chromium (browser panels — CDP screencast over WS) and node-pty (terminal panels — pty
# over WS) and runs ROTOR_MODE=panel. It is POOLED per region — a warm pool of panel pods a
# session borrows on browser-open and releases on close (density via pooling, not one fat
# pod per user). The control plane (yo/server panel broker) brokers panels onto these pods
# and enforces the per-org cap; the pod authorizes the client's scoped `gy_pt_` token by
# introspecting it back at the control plane.
#
# Naming convention: one app per region — `glyphh-ai-rrotor-panel-<region>`. This template
# is the iad (NAM-east) pool; copy it per region and set primary_region + the app name.
#
# NOT deployed by this repo. `app`, secrets (service token, introspect URL), and pool
# sizing are set by the operator / control plane per environment. Deploy the image built
# from the Dockerfile `panel` target (ghcr.io/glyphh-ai/rrotor:panel-latest).

app = "glyphh-ai-rrotor-panel-iad"
primary_region = "iad"

[build]
  # Published by .github/workflows/publish-panel.yml (Dockerfile `panel` target). The
  # control plane pulls this private GHCR image with registry auth; set at deploy time:
  #   fly deploy --image ghcr.io/glyphh-ai/rrotor:panel-latest
  image = "ghcr.io/glyphh-ai/rrotor:panel-latest"

[env]
  PORT = "8080"
  ROTOR_PORT = "8080"
  # Route the pod entry (dist/pod.js) to the panel server.
  ROTOR_MODE = "panel"
  ROTOR_LOG_FORMAT = "json"
  # The control plane's introspection endpoint — the pod validates each client's scoped
  # panel token here (a `gy_pt_` bearer; §7b). The panel data plane REQUIRES auth, so this
  # must be set in prod. Placeholder — the operator sets the real control-plane URL:
  ROTOR_AUTH_INTROSPECT_URL = "https://api.glyphh.ai/api/auth/introspect"
  # ROTOR_AUTH_SERVICE_TOKEN: the bearer the pod presents on introspection + the control
  # plane presents on the open call. Injected as a SECRET (never in [env]):
  #   fly secrets set ROTOR_AUTH_SERVICE_TOKEN=<token> -a glyphh-ai-rrotor-panel-iad

[http_service]
  internal_port = 8080
  # The browser connects DIRECT to the pod's public ws endpoint (the control plane does
  # not proxy the stream), so this is internet-facing over TLS; the scoped panel token is
  # the auth. Keep a warm floor so a browser-open doesn't cold-start Chromium.
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # A POOL: keep at least one panel pod warm per region (raise for real load). Chromium
  # cold-start is slow, so unlike session pods this floor is > 0.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  # BIGGER than a session pod (deploy/fly.toml is shared-cpu-1x / 512mb). Headless
  # Chromium is ~150–200MB idle + per-page + screencast-encode CPU (§7b), so a panel pod
  # needs ~1GB+ RAM and real CPU. Size up for heavier pages / more concurrent panels.
  size = "shared-cpu-2x"
  memory = "2048mb"

# SHARED MEMORY: containerized Chromium gets a tiny /dev/shm by default, which crashes
# heavy pages. The playwright driver passes --disable-dev-shm-usage, but for heavy pages
# also raise the shm size. On Fly, /dev/shm is backed by a tmpfs mount:
[[mounts]]
  # A tmpfs for Chromium's shared memory. (Fly sizes the machine's tmpfs from memory; on
  # plain `docker run` use `--shm-size=1g`, per the Dockerfile note.)
  source = "shm"
  destination = "/dev/shm"
