# One rrotor: one replica, one writer of /data. Not scaled: a second replica would be a second runtime.
{{- if and (eq (toString .Values.serverLogs) "on") (eq (toString .Values.link) "off") }}
{{- fail "serverLogs \"on\" needs the link: an air-gapped rrotor (link \"off\") sends nothing to Glyphh" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rrotor.fullname" . }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "rrotor.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "rrotor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rrotor.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rrotor.serviceAccountName" . }}
      automountServiceAccountToken: false
      hostUsers: {{ .Values.hostUsers }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rrotor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7777
              protocol: TCP
          env:
            - name: RROTOR_MODE
              value: self
            - name: RROTOR_SERVER
              value: {{ .Values.server | quote }}
            - name: RROTOR_PUBLIC_HOST
              value: {{ include "rrotor.publicHost" . | quote }}
            - name: RROTOR_LINK
              value: {{ .Values.link | quote }}
            - name: RROTOR_DATA
              value: /data
            - name: RROTOR_RUNTIME_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "rrotor.secretName" . }}
                  key: RROTOR_RUNTIME_ID
            - name: RROTOR_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rrotor.secretName" . }}
                  key: RROTOR_RUNTIME_TOKEN
            - name: GLYPHH_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rrotor.secretName" . }}
                  key: GLYPHH_LICENSE_KEY
                  optional: true
            - name: RROTOR_LICENCE  # an earlier release's name, in a Secret made outside the chart
              valueFrom:
                secretKeyRef:
                  name: {{ include "rrotor.secretName" . }}
                  key: RROTOR_LICENCE
                  optional: true
            {{- with .Values.runtime.keysSha256 }}
            - name: RROTOR_KEYS_SHA256
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RROTOR_SERVER_LOGS
              value: {{ .Values.serverLogs | quote }}
            - name: RROTOR_AUDIT_RETENTION_DAYS
              value: {{ .Values.audit.retentionDays | quote }}
            - name: RROTOR_AUDIT_MAX_MB
              value: {{ .Values.audit.maxMb | quote }}
            - name: RROTOR_DRAIN_SIGNALS
              value: {{ .Values.drain.signals | quote }}
            - name: RROTOR_DRAIN_BUFFER
              value: {{ .Values.drain.buffer | quote }}
            - name: RROTOR_LOG_PAYLOADS
              value: {{ .Values.drain.payloads | quote }}
            {{- with .Values.drain.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rrotor.secretName" . }}
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
            {{- with .Values.drain.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.drain.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.drain.tracesSampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.drain.tracesSamplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "rrotor.resources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # The runs' scratch space: the root filesystem is read-only.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rrotor.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "rrotor.diskSize" . }}
