apiVersion: v1
kind: Service
metadata:
  name: {{ include "rrotor.fullname" . }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rrotor.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# The StatefulSet's governing Service (headless): the pod's own DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rrotor.fullname" . }}-headless
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rrotor.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 7777
      targetPort: http
      protocol: TCP
