[project]
name = "rrotor"
version = "0.9.0"
description = "rrotor: Glyphh's per-person runtime. The daemon (rrotord: link client, local API, program runner, sandbox, egress proxy) and the SDK programs import (rrotor)"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "cryptography>=43",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-exporter-otlp-proto-common==1.45.1",
]

[project.scripts]
rrotord = "rrotord.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-jsonschema>=4.23",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrotor", "src/rrotord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["sandbox: runs a real sandbox (bwrap, Landlock, seccomp): Linux, inside the image only"]
addopts = "-m 'not sandbox' --cov=rrotor --cov=rrotord --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["rrotor", "rrotord"]
concurrency = ["thread"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
python_version = "3.13"
platform = "linux"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "S", "ASYNC", "PT"]
ignore = ["S603", "S607", "ASYNC109", "ASYNC240", "PT018"]

[tool.ruff.lint.per-file-ignores]
"src/rrotord/sandbox/bwrap.py" = ["S108"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"examples/**/tests/**" = ["S101"]
"programs/**/tests/**" = ["S101", "S105", "S106"]
