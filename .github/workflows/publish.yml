name: Publish container image

# Builds the runtime pod image (deploy/Dockerfile — stateless, fungible, SPEC §17.1)
# and publishes it to GHCR. This repo ships the ARTIFACT only: deployment of real
# environments (shared regional runtimes, dedicated per-org sets) is driven by the
# glyphh control plane, which mints machines from this image — infra config does
# not live in this public repo.
#
#   ghcr.io/glyphh-ai/rrotor:latest      — tip of main
#   ghcr.io/glyphh-ai/rrotor:sha-<sha>   — every published build, immutable
#   ghcr.io/glyphh-ai/rrotor:vX.Y.Z      — release tags

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # The image is a PROD ARTIFACT (control-plane-minted machines pull it) — it
  # passes the same gate CI and the deploy run, coverage threshold included.
  # It previously published with NO verify at all.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: npm run build
      - run: npm run lint
      - run: npm run test:cov

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rrotor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
