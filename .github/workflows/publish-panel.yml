name: Publish panel image

# Builds the PANEL pod image (Dockerfile `panel` target — headless Chromium + node-pty
# baked in, ROTOR_MODE=panel) and publishes it to GHCR. This is the SEPARATE, heavier
# tier (architecture-engines-memory.md §7b): browser-streaming panels are not co-located
# with the lean session/loop pods, so they ship as their own image. The repo is PRIVATE
# (§4), so the package is PRIVATE — Fly machines pull it with registry auth minted by the
# control plane at deploy time.
#
#   ghcr.io/glyphh-ai/rrotor:panel-latest      — tip of main (panel target)
#   ghcr.io/glyphh-ai/rrotor:panel-sha-<sha>   — every published build, immutable
#
# Runs only on demand / on main so a panel-affecting change republishes; the base rotor
# image keeps its own publish.yml. Nothing here creates Fly resources or deploys — it
# publishes the ARTIFACT; the control plane mints panel machines from it.

on:
  push:
    branches: [main]
    paths:
      - "src/panel/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-panel.yml"
  workflow_dispatch:

jobs:
  publish-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rrotor
          # The panel tier is tagged with a `panel-` prefix so it never collides with the
          # base rotor image's tags in the same package.
          tags: |
            type=raw,value=panel-latest,enable={{is_default_branch}}
            type=sha,prefix=panel-sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: panel
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
