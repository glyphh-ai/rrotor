name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + lint + test)
        run: npm run verify

      - name: Coverage report
        run: npm run test:cov
