# rrotor's checks on every push and pull request: lint, types, the tests with the 100% coverage gate, the sample
# model's tests, the image with the sandbox tests inside it, the WSL root filesystem, and the self-hosting packages.
# On main, with the repository variable PUBLISH_IMAGES set to true, the one published image (the base with the Ada
# part built in, the Dockerfile's `hosted` target) is pushed to Fly's registry for the hosted machines and to
# ghcr.io/glyphh-ai/rrotor (multi-arch, :<version> and :latest) for everyone else, and its digests reported. The GHCR
# push needs the package to let this repository write to it (an org admin: the package's settings, Manage Actions
# access, glyphh-ai/rrotor with the Write role).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # glyphh-ai/ada-private's part.yml, on every push to its main: the kernel changed, so the Ada part and the hosted
  # image that carries it are built again from it (on this repository's main, as a push is).
  repository_dispatch:
    types: [ada-kernel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests examples && uv run ruff format --check src tests examples
      - name: Types
        run: uv run mypy
      - name: Tests (100% line and branch coverage of rrotor and rrotord)
        run: uv run pytest
      - name: The sample models' tests
        run: uv run pytest examples/daily_sales/tests examples/ada_tickets examples/ada_incidents -o addopts="" -p no:cacheprovider --import-mode=importlib

  # The self-hosting packages (deploy/, docs/self-hosting/): each is checked as written, nothing is started.
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose, the air-gapped overlay, and the cluster files, from .env.example
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo GLYPHH_LICENSE_KEY=example >> .env
          docker compose -f docker-compose.yml -f docker-compose.airgap.yml config -q
          echo "RROTOR_CLUSTER_SECRET=$(openssl rand -base64 32)" >> .env
          docker compose -f docker-compose.cluster.yml config -q
          test "$(docker compose -f docker-compose.cluster.yml config --services | sort | tr '\n' ' ')" = "caddy rrotor-0 rrotor-1 rrotor-2 "
          ! docker compose -f docker-compose.node.yml config -q 2>/dev/null  # refused without the node's settings
          printf '%s\n' RROTOR_NODE_ID=rrotor-0 RROTOR_CLUSTER_ADVERTISE=10.0.1.10:7778 \
            RROTOR_CLUSTER_PEERS=10.0.1.10:7778,10.0.2.10:7778,10.0.3.10:7778 >> .env
          docker compose -f docker-compose.node.yml config -q
      - name: The Caddyfiles parse
        working-directory: deploy/compose
        run: |
          for f in Caddyfile Caddyfile.airgap Caddyfile.cluster; do
            docker run --rm -e RROTOR_PUBLIC_HOST=rrotor.example.com -v "$PWD/$f:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy adapt --config /etc/caddy/Caddyfile >/dev/null
          done
      - uses: azure/setup-helm@v4
      - name: The Helm chart lints and renders, with each set of CI values (one replica, and clusters of three)
        working-directory: deploy/helm/rrotor
        run: |
          for f in ci/*.yaml; do
            helm lint . --strict -f "$f"
            helm template rrotor . -f "$f" >/dev/null
          done
          helm template rrotor . -f ci/cluster-values.yaml | grep -q 'podManagementPolicy: Parallel'
          helm template rrotor . -f ci/cluster-values.yaml | grep -q 'publishNotReadyAddresses: true'
          ! helm template rrotor . -f ci/default-values.yaml --set replicas=3 >/dev/null 2>&1  # no replicas without a cluster
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: The Terraform modules and their examples are formatted and valid
        working-directory: deploy/terraform
        run: |
          terraform fmt -recursive -check
          for d in aws aws/examples/basic aws/examples/cluster gcp gcp/examples/basic gcp/examples/cluster; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  image:
    runs-on: ubuntu-24.04
    needs: checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build the base and the sandbox tests (amd64, for this runner)
        run: |
          docker buildx build -f image/Dockerfile --target base --load -t rrotor:ci .
          docker buildx build -f image/Dockerfile --target sandbox-test --load -t rrotor:ci-sandbox-test .
      - name: Let unprivileged user namespaces make their own network (Ubuntu 23.10+ restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The sandbox holds (bwrap, Landlock, seccomp, the egress proxy) inside the image
        run: |
          docker run --rm --tmpfs /tmp:exec,mode=1777 \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=unconfined \
            rrotor:ci-sandbox-test
      - name: The daemon starts, checks every layer and answers its local API
        run: |
          token=$(openssl rand -hex 32); sha=$(printf %s "$token" | sha256sum | cut -d' ' -f1)
          docker run -d --name smoke --read-only --tmpfs /tmp:exec,mode=1777 -v smoke:/data -p 127.0.0.1:7777:7777 \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=unconfined \
            -e RROTOR_SERVER=http://127.0.0.1:9 -e RROTOR_LOCAL_TOKEN_SHA256="$sha" rrotor:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7777/healthz && break; sleep 1; done
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:7777/v1/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['sandbox']['ready'], h['sandbox']"
          docker rm -f smoke
      - name: Self-hosted and air-gapped, it answers at its one public host, its link off
        run: |
          key=$(openssl rand -hex 32); sha=$(printf %s "$key" | sha256sum | cut -d' ' -f1)
          docker run -d --name smoke-self --read-only --tmpfs /tmp:exec,mode=1777 -v smoke-self:/data \
            -p 127.0.0.1:7778:7777 \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=unconfined \
            -e RROTOR_MODE=self -e RROTOR_LINK=off -e RROTOR_PUBLIC_HOST=rrotor.example.com \
            -e RROTOR_RUNTIME_ID="$(python3 -c 'import uuid; print(uuid.uuid4())')" \
            -e RROTOR_RUNTIME_TOKEN="tok_$(openssl rand -hex 16)" -e RROTOR_KEYS_SHA256="$sha" rrotor:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7778/healthz && break; sleep 1; done
          curl -sf -H "Host: rrotor.example.com" -H "Authorization: Bearer $key" http://127.0.0.1:7778/v1/health \
            | tee health-self.json
          python3 -c "import json; h=json.load(open('health-self.json')); assert (h['mode'], h['link']['state'], h['sandbox']['ready']) == ('self', 'off', True), h"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: elsewhere.example.com' http://127.0.0.1:7778/v1/health)" = 421
          docker rm -f smoke-self
      - name: A three-node Compose cluster comes up (with a licence key that allows sync, the secret CI_CLUSTER_LICENSE_KEY)
        working-directory: deploy/compose
        env:
          KEY: ${{ secrets.CI_CLUSTER_LICENSE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::notice::CI_CLUSTER_LICENSE_KEY is not set; the cluster is not brought up."; exit 0; }
          docker tag rrotor:ci ghcr.io/glyphh-ai/rrotor:ci
          key=$(openssl rand -hex 32); sha=$(printf %s "$key" | sha256sum | cut -d' ' -f1)
          cp .env.example .env
          sed -i "s/^RROTOR_RUNTIME_ID=.*/RROTOR_RUNTIME_ID=$(python3 -c 'import uuid; print(uuid.uuid4())')/; s/^RROTOR_RUNTIME_TOKEN=.*/RROTOR_RUNTIME_TOKEN=tok_$(openssl rand -hex 16)/; s/^RROTOR_VERSION=.*/RROTOR_VERSION=ci/" .env
          printf '%s\n' RROTOR_LINK=off "GLYPHH_LICENSE_KEY=$KEY" "RROTOR_KEYS_SHA256=$sha" \
            "RROTOR_CLUSTER_SECRET=$(openssl rand -base64 32)" >> .env
          c="docker compose -f docker-compose.cluster.yml"
          $c up -d rrotor-0 rrotor-1 rrotor-2
          ready() { $c exec -T "$1" /opt/rrotord/bin/python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:7777/readyz', timeout=2)" 2>/dev/null; }
          for i in $(seq 1 90); do ready rrotor-0 && ready rrotor-1 && ready rrotor-2 && break; sleep 2; done
          # The head holds the membership; a follower's view can trail it by a ping.
          for i in $(seq 1 30); do
            $c exec -T rrotor-0 /opt/rrotord/bin/python -c "import json, urllib.request as u; r = u.Request('http://127.0.0.1:7777/v1/cluster', headers={'Host': 'rrotor.example.com', 'Authorization': 'Bearer $key'}); print(json.dumps(json.load(u.urlopen(r, timeout=5))))" > cluster.json || true
            python3 -c "import json; c=json.load(open('cluster.json')); assert (c['head'], len(c['members'])) == ('rrotor-0', 3)" 2>/dev/null && break
            sleep 2
          done
          cat cluster.json
          python3 -c "import json; c=json.load(open('cluster.json')); assert (c['head'], len(c['members'])) == ('rrotor-0', 3), c"
          $c logs --no-color | tail -50
          $c down -v
      - name: "The WSL root filesystem (Windows, designed): exported from the base image"
        run: |
          id=$(docker create rrotor:ci)
          docker export "$id" | gzip -9 > "rrotor-wsl-${{ steps.v.outputs.version }}-amd64.tar.gz"
          docker rm "$id"
      - uses: actions/upload-artifact@v4
        with:
          name: rrotor-wsl-${{ steps.v.outputs.version }}-amd64
          path: rrotor-wsl-*.tar.gz
          retention-days: 14

  # The published image: the base with the Ada part built in, one image for hosted, self-hosted and local rrotors
  # (RROTOR_MODE decides; the licence key sets its limits). Pushed first to Fly's own registry for the runtimes app
  # (vars.FLY_RUNTIME_APP, glyphh-ai-runtime), the one private registry Fly machines pull from, amd64, which is what
  # Fly runs (the server's GLYPHH_FLY_IMAGE names registry.fly.io/<app>:<version>); then to
  # ghcr.io/glyphh-ai/rrotor:<version> and :latest, amd64 and arm64, for the deploy packages. Built only
  # when the part was (both secrets set), images are published and FLY_API_TOKEN is set.
  image-hosted:
    runs-on: ubuntu-24.04
    needs: [image, part-ada]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    permissions:
      contents: read
      packages: write
    env:
      APP: ${{ vars.FLY_RUNTIME_APP || 'glyphh-ai-runtime' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rrotor-part-ada
          path: dist/parts
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - name: Push the hosted image to Fly's registry (amd64)
        env:
          # The key a hosted rrotor checks a part's signature with, baked in (the licence key's is in the code).
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          [ -n "$RELEASE_PUBLIC_KEY" ] || { echo "::error::Set the variable RELEASE_PUBLIC_KEY."; exit 1; }
          repo=registry.fly.io/$APP; v=${{ steps.v.outputs.version }}; s=sha-${GITHUB_SHA::12}
          docker buildx build -f image/Dockerfile --target hosted --platform linux/amd64 \
            --build-arg VERSION="$v" --build-arg RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY" -t "$repo:$v" -t "$repo:$s" \
            --push .
          echo "hosted: $repo:$v ($(docker buildx imagetools inspect "$repo:$s" --format '{{json .Manifest.Digest}}'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same image to GHCR (amd64 and arm64), :<version> and :latest
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          repo=ghcr.io/glyphh-ai/rrotor; v=${{ steps.v.outputs.version }}; s=sha-${GITHUB_SHA::12}
          docker buildx build -f image/Dockerfile --target hosted --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$v" --build-arg RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY" \
            -t "$repo:$v" -t "$repo:latest" -t "$repo:$s" --push .
          echo "ghcr: $repo:$v ($(docker buildx imagetools inspect "$repo:$s" --format '{{json .Manifest.Digest}}'))" >> "$GITHUB_STEP_SUMMARY"

  # The Ada part, for both architectures: the kernel from glyphh-ai/ada-private (branch main, read
  # with ADA_KERNEL_TOKEN) and numpy, signed with RROTOR_RELEASE_KEY when it is set (else built unsigned-checked:
  # the signature step needs the key). The tarballs are kept as artifacts, and published as the release
  # `part-ada-<kernel version>` (made the first time, its assets replaced after): each
  # tarball, its .sha256 and its .sig; the hosted image builds them in.
  part-ada:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: The Ada kernel
        env:
          TOKEN: ${{ secrets.ADA_KERNEL_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::notice::ADA_KERNEL_TOKEN is not set; the Ada part is not built."; exit 0; }
          git clone -q --depth 1 --branch main "https://x-access-token:${TOKEN}@github.com/glyphh-ai/ada-private.git" kernel
      - name: Build and sign, amd64 and arm64
        if: hashFiles('kernel/glyphh_kernel.py') != ''
        env:
          RROTOR_RELEASE_KEY: ${{ secrets.RROTOR_RELEASE_KEY }}
        run: |
          [ -n "$RROTOR_RELEASE_KEY" ] || { echo "::notice::RROTOR_RELEASE_KEY is not set; the Ada part is not signed or kept."; exit 0; }
          pip install -q cryptography
          for arch in amd64 arm64; do parts/ada/build.sh --arch "$arch" --kernel kernel --out dist/parts; done
          ls -la dist/parts && cat dist/parts/*.sha256
      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/parts/*.tar.gz') != ''
        with:
          name: rrotor-part-ada
          path: dist/parts/
          retention-days: 30
      - name: Publish the part as the release part-ada-<version>
        if: hashFiles('dist/parts/*.tar.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(ls dist/parts/ada-*-amd64.tar.gz | sed -E 's#.*/ada-(.+)-amd64\.tar\.gz#\1#')
          tag="part-ada-$v"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Ada part $v" \
            --notes "The Ada part $v for rrotor: the kernel and numpy, signed with Glyphh's release key."
          gh release upload "$tag" dist/parts/* --clobber
          for arch in amd64 arm64; do
            echo "$arch: https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/ada-$v-$arch.tar.gz sha256 $(cut -d' ' -f1 "dist/parts/ada-$v-$arch.sha256")" >> "$GITHUB_STEP_SUMMARY"
          done

