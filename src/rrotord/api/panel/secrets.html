<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secrets</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:16px;background:transparent;color:var(--color-text-primary,CanvasText);
  font-family:var(--font-sans,system-ui,sans-serif);font-size:var(--font-text-md-size,14px);line-height:var(--font-text-md-line-height,1.45)}
.top{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:var(--font-heading-sm-size,16px);font-weight:var(--font-weight-semibold,600)}
.sub{color:var(--color-text-secondary,GrayText);font-size:var(--font-text-sm-size,12px)}
.secret{border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  border-radius:var(--border-radius-lg,12px);padding:10px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.name{font-family:var(--font-mono,ui-monospace,monospace);font-weight:var(--font-weight-semibold,600);overflow-wrap:anywhere}
.chip{font-size:var(--font-text-sm-size,12px);padding:1px 8px;border-radius:999px;white-space:nowrap;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35))}
.unset{border-color:var(--color-border-warning,#c98a00);color:var(--color-text-warning,inherit)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{font:inherit;padding:5px 8px;border-radius:var(--border-radius-md,8px);flex:1 1 180px;min-width:0;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-primary,Canvas);color:inherit}
button{font:inherit;padding:5px 14px;border-radius:var(--border-radius-md,8px);cursor:pointer;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-secondary,transparent);color:var(--color-text-primary,CanvasText)}
button.primary{background:var(--color-text-primary,CanvasText);color:var(--color-background-primary,Canvas);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--color-ring-primary,Highlight);outline-offset:2px}
.done{color:var(--color-text-success,inherit)} .bad{color:var(--color-text-danger,inherit)} [hidden]{display:none!important}
.empty{color:var(--color-text-secondary,GrayText)}
</style></head>
<body>
<div class="top"><h1 id="title">Secrets</h1><span class="sub" id="meta"></span></div>
<p class="empty" id="waiting">Waiting for the program's secrets.</p>
<div id="rows"></div>
<p class="sub" id="note" hidden>What you type goes straight to this runtime's vault, encrypted there. Claude never sees it, and it is never shown back.</p>
<p class="done" id="saved" hidden></p>
<p class="bad" id="error" hidden></p>
<script type="module">__APP_JS__</script>
<script type="module">
// A program's secrets on this rrotor, from secrets_form: each name its manifest declares, whether it is set, and a
// field to set it. A value typed here goes to the rrotor's vault through the host (secret_set), never into the chat;
// Claude is told only which names were set or removed.
const $ = (id) => document.getElementById(id);
const app = new window.McpApp({ name: "rrotor-secrets", version: "1" }, {}, { autoResize: true });
const view = { program: null, secrets: [], busy: false };

function theme(ctx) {
  if (!ctx) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(ctx.styles?.variables || {})) if (v) root.style.setProperty(k, v);
  if (ctx.theme) root.style.colorScheme = ctx.theme;
  const fonts = ctx.styles?.css?.fonts;
  if (fonts && !$("host-fonts")) { const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.append(s); }
}

function failed(message) { $("error").textContent = message; $("error").hidden = !message; }
function said(message) { $("saved").textContent = message; $("saved").hidden = !message; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

async function tool(name, args) {
  const r = await app.callServerTool({ name, arguments: args });
  if (r?.isError) throw new Error(r.structuredContent?.error?.message || r.content?.[0]?.text || "The runtime refused.");
  return r?.structuredContent || {};
}

async function tell(text) { try { await app.updateModelContext({ content: [{ type: "text", text }] }); } catch {} }

async function act(what, done, told) {
  if (view.busy) return;
  view.busy = true; failed(""); said(""); show();
  try {
    await what();
    view.secrets = (await tool("secrets_list", { program: view.program })).secrets || [];
    const unset = view.secrets.filter((s) => s.declared && !s.set).map((s) => s.name);
    said(unset.length ? done : `${done} Every secret ${view.program} declares is set.`);
    tell(`${told} ${unset.length ? `Still not set: ${unset.join(", ")}.` : `Every secret ${view.program} declares is set.`} (Values are in the runtime's vault, not in this chat.)`);
  } catch (e) {
    failed(e.message);
  }
  view.busy = false; show();
}

function row(s) {
  const box = el("div", "secret");
  const head = el("div", "head");
  head.append(el("span", "name", s.name));
  head.append(el("span", "chip" + (s.set ? "" : " unset"), s.set ? "Set" : s.declared ? "Not set" : "Not declared"));
  box.append(head);
  const line = el("div", "row");
  const input = el("input"); input.type = "password"; input.autocomplete = "off"; input.spellcheck = false;
  input.placeholder = s.set ? "A new value" : "Value"; input.setAttribute("aria-label", `${s.name}'s value`);
  const save = el("button", "primary", s.set ? "Replace" : "Save"); save.disabled = true;
  input.oninput = () => { save.disabled = !input.value || view.busy; };
  const put = () => {
    const value = input.value;
    if (!value) return;
    input.value = "";
    act(() => tool("secret_set", { program: view.program, name: s.name, value }), `${s.name} is set.`, `The person set ${view.program}'s secret ${s.name}.`);
  };
  save.onclick = put;
  input.onkeydown = (e) => { if (e.key === "Enter") put(); };
  line.append(input, save);
  if (s.set) {
    const remove = el("button", "", "Remove");
    remove.onclick = () => act(() => tool("secret_delete", { program: view.program, name: s.name }), `${s.name} is removed.`, `The person removed ${view.program}'s secret ${s.name}.`);
    line.append(remove);
  }
  if (!s.declared) box.append(el("span", "sub", "Kept here, but this program's glyphh.json no longer names it."));
  box.append(line);
  for (const x of box.querySelectorAll("input,button")) if (view.busy) x.disabled = true;
  return box;
}

function show() {
  if (!view.program) return;
  $("waiting").hidden = true;
  $("title").textContent = `Secrets · ${view.program}`;
  const set = view.secrets.filter((s) => s.set).length;
  $("meta").textContent = view.secrets.length ? `${set} of ${view.secrets.length} set` : "";
  $("note").hidden = !view.secrets.length;
  const rows = view.secrets.map(row);
  if (!rows.length) rows.push(el("p", "empty", `${view.program} declares no secrets: name them in its glyphh.json ("secrets": ["API_KEY"]) and deploy it.`));
  $("rows").replaceChildren(...rows);
}

app.ontoolresult = (result) => {
  if (result?.isError) { failed(result.structuredContent?.error?.message || result.content?.[0]?.text || "The runtime refused."); $("waiting").hidden = true; return; }
  const got = result?.structuredContent || {};
  view.program = got.program || null; view.secrets = got.secrets || []; said(""); failed(""); show();
};
app.onhostcontextchanged = theme;
app.connect().then(() => theme(app.getHostContext())).catch((e) => failed("The form could not connect: " + (e?.message || e)));
</script>
</body></html>
