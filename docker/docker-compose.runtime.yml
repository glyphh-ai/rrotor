# The LOCAL runtime — the deterministic loop + harness, memory plane CUT
# (2026-08-24): no stator container, no redis, no embedder/enricher sidecars.
# The loop's determinism store rides SQLite inside each pod; the HARNESS's
# thread/transcript persistence rides the ORG'S OWN regional database — the
# server compose's userstore (org schemas), the same store the control plane
# reads. One database, all the org's data together.
#
# Build the app image first:
#   (cd .. && docker build -t rrotor:dev .)

name: runtime

services:
  rrotor:
    image: rrotor:dev
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Local-dev determinism store: SQLite in the pod's own tmp (the image
      # runs as uid 1000; a named volume mounts root-owned and SQLITE_CANTOPENs).
      # Cloud pods point this at the org schema in the regional userstore.
      ROTOR_STATOR_BACKEND: sqlite
      ROTOR_STATOR_URL: /tmp/rotor-stator.sqlite
    restart: unless-stopped

  rrotor-harness:
    image: rrotor:dev
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      ROTOR_MODE: harness
      # Threads/transcripts persist into the org schemas of the SERVER's
      # userstore (server/docker-compose.yml publishes it on 5435) — the same
      # per-org store the control plane's tenantDb reads.
      ROTOR_STATOR_BACKEND: pgvector
      ROTOR_STATOR_URL: postgres://glyphh:glyphh@host.docker.internal:5435/user_store
      # Must MATCH the local server's SERVICE_TOKEN (server/.env) or every
      # introspection call is rejected and all user-bearer routes 401.
      ROTOR_AUTH_SERVICE_TOKEN: ${ROTOR_AUTH_SERVICE_TOKEN:-dev-only-service-token}
      ROTOR_AUTH_INTROSPECT_URL: http://host.docker.internal:3001/api/auth/introspect
      GLYPHH_GATEWAY_URL: http://host.docker.internal:3001/api/gateway
      HARNESS_MODEL: anthropic::claude-sonnet-5
    restart: unless-stopped
