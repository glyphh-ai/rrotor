# RECONSTRUCTED 2026-08-11 — the original runtime/ directory vanished from disk
# (deleted to free disk space). This file was
# rebuilt from `docker inspect` of the live containers so the stack stays
# operable: service names, aliases, ports, env and the named volumes match the
# running originals exactly. If the original repo turns up (git remote?), prefer
# it over this reconstruction.
#
# Build the app image first:
#   (cd .. && docker build -t rrotor:dev .)

name: runtime

services:
  stator:
    image: pgvector/pgvector:pg16
    # 64MB /dev/shm default starves Postgres parallel workers at real schema
    # counts ("could not resize shared memory segment"); give it real room.
    shm_size: 1gb
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: glyphh
      POSTGRES_PASSWORD: glyphh
      POSTGRES_DB: rotor_stator
    volumes:
      - rotor_stator:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphh -d rotor_stator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - rotor_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rrotor:
    image: rrotor:dev
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      ROTOR_STATOR_BACKEND: pgvector
      ROTOR_STATOR_URL: postgres://glyphh:glyphh@stator:5432/rotor_stator
      # ── workpanel app workers (slice 5a) ────────────────────────────────
      # POST /app-worker/invoke + durable app cron. The pod needs a control-
      # plane credential of its own (GLYPHH_RUNTIME_TOKEN — a gy_rk_ runtime
      # token / API key for the org this pod serves) to mint gy_wk_ worker
      # tokens and download bundles. Inject it at `docker compose up` time;
      # unset, app workers stay OFF (service.ts logs loudly and disarms).
      ROTOR_APP_WORKERS: "1"
      GLYPHH_CONTROL_URL: http://host.docker.internal:3001
      GLYPHH_RUNTIME_TOKEN: ${GLYPHH_RUNTIME_TOKEN:-}
      ROTOR_APP_CACHE_DIR: /tmp/rrotor-app-bundles
      # Caller auth on the data plane (incl. /app-worker/invoke): introspect
      # bearers against the local control plane. The service token must MATCH
      # the server's SERVICE_TOKEN (server/.env) or every call 401s.
      ROTOR_AUTH_SERVICE_TOKEN: ${ROTOR_AUTH_SERVICE_TOKEN:-dev-only-service-token}
      ROTOR_AUTH_INTROSPECT_URL: http://host.docker.internal:3001/api/auth/introspect
    depends_on:
      stator:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rrotor-harness:
    image: rrotor:dev
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      ROTOR_MODE: harness
      ROTOR_STATOR_BACKEND: pgvector
      ROTOR_STATOR_URL: postgres://glyphh:glyphh@stator:5432/rotor_stator
      # Must MATCH the local server's SERVICE_TOKEN (server/.env) or every
      # introspection call is rejected and all user-bearer routes 401.
      ROTOR_AUTH_SERVICE_TOKEN: ${ROTOR_AUTH_SERVICE_TOKEN:-dev-only-service-token}
      ROTOR_AUTH_INTROSPECT_URL: http://host.docker.internal:3001/api/auth/introspect
      GLYPHH_GATEWAY_URL: http://host.docker.internal:3001/api/gateway
      HARNESS_MODEL: anthropic::claude-sonnet-5
      ROTOR_ENRICH_MODEL_ID: qwen3-1.7b
      ROTOR_ENRICH_MODEL_URL: http://host.docker.internal:8090/v1
    depends_on:
      stator:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rotor_stator:
  rotor_redis:
