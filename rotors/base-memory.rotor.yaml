# ─────────────────────────────────────────────────────────────────────────────
# glyphh/base-memory@1.0.0 — the single-model base loop WITH durable memory.
#
# base-single plus the two memory verbs around it: every turn is absorbed into
# the stator first (write §7.4 — "my name is Tim" becomes a (user, name, Tim)
# fact; directives become standing directives), then recall runs both ways —
# the user's fact node (retrieve.kb §7.6) and semantically similar earlier
# turns (retrieve.vector §7.7) — and the composed prompt carries both. Memory
# lives in the stator: per-process by default, durable across restarts with
# ROTOR_STATOR_BACKEND=sqlite.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rotor.glyphh.ai/v0.1
kind: Rotor
metadata:
  name: base-memory
  version: 1.1.0
  namespace: glyphh
  description: The single-model base loop with durable memory — absorb → recall (facts + turns) → grounded respond → deliver.
  labels:
    tier: base
    domain: general
    mode: chat

spec:
  inputs:
    - name: prompt
      type: string
      required: true
      description: The user turn to satisfy.
    - name: entity
      type: string
      description: Optional memory entity to ground against.

  # Required: `remember` (write) and the retrieve.* steps bind an HDC space (§15.4).
  space:
    vector_dim: 10000
    encoder_seed: 42
    roles_config: universal-7x33

  state:
    schema:
      answer: { type: string }
    reducers:
      answer: last-write-wins

  entry: log-user

  steps:
    # ── log-user ─────────────────────────────────────────────────────────────
    # Record the user's side of the exchange (§7.4 turn): into the session's
    # RECENCY window and the similarity corpus, speaker-tagged. Declared steps
    # are the only writers of conversation — composed prompts never record.
    - id: log-user
      type: write
      display: { label: "logging the turn", output: min }
      in: { text: $.inputs.prompt }
      out: { logged: boolean }
      config:
        mode: turn
        speaker: user
      next: remember

    # ── remember ─────────────────────────────────────────────────────────────
    # Absorb the turn into the stator (§7.4): the deterministic enricher lifts
    # directives and self-facts ("my name is …") into structured slots; anything
    # unmatched persists as raw text. Keyed to the `user` entity.
    - id: remember
      type: write
      display: { label: "remembering the turn" }
      in: { text: $.inputs.prompt }
      out: { written: number }
      config:
        mode: absorb
        key: user
        speaker: user
      next: facts

    # ── facts ────────────────────────────────────────────────────────────────
    # The user's full fact node (§7.6): every current (role, filler) edge the
    # stator holds about them — names, preferences, standing directives.
    - id: facts
      type: retrieve.kb
      display: { label: "recalling facts" }
      in: { entity: $.inputs.entity }
      out: { edges: array }
      config:
        mode: node
        entity: user
      next: recall

    # ── recall ───────────────────────────────────────────────────────────────
    # Semantic recall of similar earlier turns (§7.7), so "what did I ask
    # before?" has something to stand on. Small and thresholded to keep the
    # composed prompt bounded.
    - id: recall
      type: retrieve.vector
      display: { label: "recalling earlier turns" }
      in: { query: $.inputs.prompt }
      out: { hits: array }
      config:
        top_k: 4
        kind: query
        threshold: 0.3
      next: recent

    # ── recent ───────────────────────────────────────────────────────────────
    # The RECENCY channel (§7.7 kind: recent): the last exchanges of THIS
    # session, in order — what "how do you know?" needs; similarity can't
    # retrieve an anaphor's referent because its meaning is positional.
    - id: recent
      type: retrieve.vector
      display: { label: "reading the conversation" }
      in: { query: $.inputs.prompt }
      out: { transcript: string, count: number }
      config:
        kind: recent
        window: 6
      next: compose

    # ── compose ──────────────────────────────────────────────────────────────
    # The bounded prompt (§7.1): stable system block, then the recalled memory,
    # then the user turn. `cache.breakpoints` marks the system block (§8).
    - id: compose
      type: prompt
      display: { label: "composing the prompt", output: min }
      in:
        question: $.inputs.prompt
        facts: $.steps.facts.edges
        recall: $.steps.recall.hits
        conversation: $.steps.recent.transcript
      out: { text: string }
      config:
        blocks:
          - name: system
            text: "You are Glyphh, a grounded assistant with memory. The conversation so far is authoritative context: use it to resolve references like 'it' or 'that' and to answer follow-up questions about your own earlier answers. Answer directly and concisely from the conversation, the known facts, and your general knowledge. Say you don't know only when you truly lack the information."
          - name: memory
            text: "Known facts about the user: {{facts}}\nRelevant earlier turns: {{recall}}"
          - name: conversation
            text: "Conversation so far:\n{{conversation}}"
          - name: user
            text: "user: {{question}}\nassistant:"
        max_tokens: 2048
        cache: { breakpoints: [system] }
      next: respond

    # ── respond ──────────────────────────────────────────────────────────────
    # The single bound model answers (§7.2). `config.model: assistant` is the
    # ROLE the control plane binds via the model registry.
    - id: respond
      type: model
      display: { label: "thinking", detail: "role: assistant", output: min }
      in: { text: $.steps.compose.text, entity: $.inputs.entity }
      out: { text: string }
      config:
        model: assistant
        lane: local
        max_tokens: 2048
      next: deliver

    # ── deliver ──────────────────────────────────────────────────────────────
    # Terminal (§7.9): assert the model's answer (present → asserted), or refuse.
    - id: deliver
      type: assert
      display: { label: "answering", output: min }
      in: { filler: $.steps.respond.text }
      out: { text: string }
      config:
        refusal: "I don't know."
      next: log-answer

    # ── log-answer ───────────────────────────────────────────────────────────
    # Record the assistant's side of the exchange — the window holds BOTH
    # voices, so the next turn's anaphora has its referents.
    - id: log-answer
      type: write
      display: { label: "logging the answer", output: min }
      in: { text: $.steps.deliver.text }
      out: { logged: boolean }
      config:
        mode: turn
        speaker: assistant
      next: end

  outputs:
    - name: answer
      from: $.steps.deliver.text
